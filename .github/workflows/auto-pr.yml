name: Auto PR

on:
  push:
#    branches-ignore:
#      - main

jobs:         # GitHub Actions 的“任务列表”
  create-pr:  # job 名字 随便取
    runs-on: ubuntu-latest  # 运行环境 这个任务运行在 Ubuntu 虚拟机上，GitHub 会临时创建一台 Linux 机器执行你的脚本

    steps:    # 任务步骤列表
      - uses: actions/checkout@v4 # 这一步是把当前仓库的代码检出到虚拟机上，后续步骤就可以访问这些代码了。相当于：git clone xxx；uses 是 GitHub Actions 的一个关键字，表示使用一个现成的 Action 来完成某个功能，这里用的是官方提供的 checkout Action 来检出代码。

      - name: Create Pull Request # 这一步的名字，可以随便取，主要是为了让日志更清晰
        uses: peter-evans/create-pull-request@v6 # 这一步使用了 peter-evans/create-pull-request 这个第三方 Action 来创建 Pull Request。这个 Action 可以简化创建 PR 的流程，不需要你自己写复杂的脚本来调用 GitHub API。
        with:                     # 这个 with 块是给这个 Action 传递参数的地方，不同的 Action 需要不同的参数，具体可以参考这个 Action 的文档。
          token: ${{ secrets.GITHUB_TOKEN }}     # 这个 token 是 GitHub 自动提供的一个访问令牌，可以用来认证你的 Action，允许它执行一些操作，比如创建 PR。你不需要自己设置这个 token，GitHub 会自动注入到你的工作流中。
          base: main                             # 这个参数指定了 PR 的目标分支，也就是你想把代码合并到哪个分支。这里是 main 分支，你可以根据你的项目结构修改成其他分支。
          branch: ${{ github.ref_name }}         # 这个参数指定了 PR 的源分支，也就是你想从哪个分支创建 PR。这里使用了 GitHub 提供的一个上下文变量 github.ref_name，表示当前触发事件的分支名字。因为这个工作流是监听 feat/auto-pr 分支的 push 事件，所以当你在 feat/auto-pr 分支上 push 代码时，这个参数就会自动被替换成 feat/auto-pr，从而创建一个从 feat/auto-pr 到 main 的 PR。
          title: "Review: ${{ github.ref_name }}" # 这个参数指定了 PR 的标题，你可以根据需要修改成更合适的标题。
          body: "Created automatically for Codex review"  # 这个参数指定了 PR 的描述，你也可以根据需要修改成更合适的描述。